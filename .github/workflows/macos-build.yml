name: macOS Build Gate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: macos-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show toolchain
        run: xcodebuild -version

      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate-phase3.ps1

      - name: Build
        run: >-
          xcodebuild build
          -project Goosegrass.xcodeproj
          -scheme Goosegrass
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: >-
          xcodebuild test
          -project Goosegrass.xcodeproj
          -scheme Goosegrass
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
